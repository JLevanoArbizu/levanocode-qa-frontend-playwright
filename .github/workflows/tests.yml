name: E2E Playwright Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly run a la medianoche (UTC) todos los días
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Permite disparar la ejecución manualmente desde GitHub

jobs:
  test-e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Get Allure History from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: allure-report
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm ci

      - name: Install Java (Required for Allure)
        run: apt-get update && apt-get install -y default-jre
          
      - name: Execute QA Automation Suite
        run: npm run test:ci:qa
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-reports
          path: |
            allure-report/
            reports/
          retention-days: 3

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
